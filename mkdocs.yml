site_name: fastapi-easy-versioning
site_description: Versioned APIs for FastAPI — one sub-app per version, automatic endpoint inheritance and a regenerated OpenAPI schema per version.
site_url: https://feodor-ra.github.io/fastapi-easy-versioning/
repo_url: https://github.com/feodor-ra/fastapi-easy-versioning
repo_name: feodor-ra/fastapi-easy-versioning
edit_uri: edit/master/docs/
copyright: MIT License

extra_css:
  - stylesheets/extra.css

theme:
  name: material
  custom_dir: overrides
  icon:
    logo: material/source-branch
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: red
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: red
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.details
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        # Material renders mermaid client-side; without this fence the diagrams
        # on the example pages degrade into plain code blocks.
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search:
      lang:
        - en
        - ru
  - i18n:
      docs_structure: folder
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: ru
          name: Русский
          build: true
          nav_translations:
            Overview: Обзор
            Guide: Руководство
            Examples: Примеры
            API Reference: Справочник API
            Changelog: История изменений
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            docstring_style: google
            docstring_section_style: table
            separate_signature: true
            signature_crossrefs: true
            show_signature_annotations: true
            merge_init_into_class: true
            show_source: false
            show_root_heading: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            filters:
              - "!^_"

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/feodor-ra/fastapi-easy-versioning
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/fastapi-easy-versioning/
    - icon: fontawesome/brands/telegram
      link: https://t.me/ratschew

nav:
  - Overview:
      - index.md
      - quickstart.md
  - Guide:
      - guide/dependency.md
      - guide/middleware.md
      - guide/recipes.md
      - guide/limitations.md
  - Examples:
      - examples/simple.md
      - examples/multiple.md
  - API Reference:
      - reference/dependency.md
      - reference/middleware.md
  - Changelog:
      - changelog.md
