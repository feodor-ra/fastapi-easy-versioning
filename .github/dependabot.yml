# Weekly dependency updates for the uv project.
# Scoped to dev dependencies only: `dependency-type: development` covers the
# PEP 735 [dependency-groups] (lint / examples / test / docs) and excludes
# [project.dependencies] (fastapi, typing-extensions), whose lower bounds are
# intentional for library compatibility and must not be bumped automatically.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    allow:
      - dependency-type: "development"
    versioning-strategy: increase
    # Collapse all the dev-dependency bumps into a single weekly PR.
    groups:
      dev-dependencies:
        patterns:
          - "*"
        # The [build-system] uv_build range has no resolved "previous version",
        # and Dependabot drops the WHOLE group change when one member fails
        # that way — keep it in a PR of its own.
        exclude-patterns:
          - "uv-build"
    commit-message:
      prefix: "chore(deps)"

  # Hook revs mirror the lint pins above (ruff, ty, uv); bump them in the same
  # weekly cycle so the two stay in sync.
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      pre-commit-hooks:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps)"
